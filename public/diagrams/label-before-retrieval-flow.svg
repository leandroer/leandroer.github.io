<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Governed data flow for retrieval-augmented generation</title>
  <desc id="desc">Source data passes through ownership and classification, an AI-use approval gate, chunking and embedding, tenant-scoped storage, permission-aware retrieval, prompt assembly, output controls, and isolated agent memory. Policy changes invalidate derived data.</desc>
  <defs>
    <style>.bg{fill:#0d2749}.grid{stroke:#fff;stroke-opacity:.045}.box{fill:#153760;stroke:#668db7;stroke-width:1.4}.control{fill:#1d456f;stroke:#9dccff;stroke-width:1.7}.store{fill:#173e5d;stroke:#79b9de;stroke-width:1.7}.deny{fill:#492c3b;stroke:#e59687;stroke-width:1.5}.t{fill:#f5f9fd;font:600 16px Arial,sans-serif}.s{fill:#b6c9dd;font:12px Arial,sans-serif}.k{fill:#9dccff;font:700 11px Menlo,monospace;letter-spacing:1px}.line{fill:none;stroke:#9dccff;stroke-width:1.7}.event{fill:none;stroke:#e7a18f;stroke-width:1.5;stroke-dasharray:6 5}.label{fill:#9dccff;font:700 9px Menlo,monospace}.eventlabel{fill:#e7a18f;font:700 9px Menlo,monospace}</style>
    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" class="grid" fill="none"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#9dccff"/></marker>
    <marker id="eventarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#e7a18f"/></marker>
  </defs>
  <rect width="1200" height="760" class="bg"/><rect width="1200" height="760" fill="url(#g)"/>
  <text x="48" y="45" class="k">RAG DATA PLANE / SECURITY CONTEXT MUST SURVIVE EVERY TRANSFORMATION</text>
  <text x="48" y="83" class="label">INGESTION PLANE</text>
  <rect x="48" y="100" width="190" height="92" rx="3" class="box"/><text x="68" y="132" class="t">Authoritative source</text><text x="68" y="157" class="s">Content · owner · ACL</text><text x="68" y="176" class="s">Version · source ID</text>
  <rect x="278" y="100" width="195" height="92" rx="3" class="control"/><text x="298" y="132" class="t">Classification gate</text><text x="298" y="157" class="s">Label · tenant · retention</text><text x="298" y="176" class="s">Permitted AI use</text>
  <path d="M238 146h40" class="line" marker-end="url(#arrow)"/>
  <path d="M555 95l82 51-82 51-82-51z" class="control"/><text x="512" y="140" class="t">AI use</text><text x="515" y="161" class="s">approved?</text><path d="M473 146h4" class="line" marker-end="url(#arrow)"/>
  <rect x="485" y="240" width="140" height="72" rx="3" class="deny"/><text x="507" y="271" class="t">Quarantine</text><text x="507" y="293" class="s">Owner review</text><path d="M555 197v43" class="event" marker-end="url(#eventarrow)"/><text x="565" y="221" class="eventlabel">NO</text>
  <rect x="680" y="100" width="180" height="92" rx="3" class="box"/><text x="700" y="132" class="t">Parse and chunk</text><text x="700" y="157" class="s">Preserve source identity</text><text x="700" y="176" class="s">Validate content</text><path d="M637 146h43" class="line" marker-end="url(#arrow)"/><text x="648" y="135" class="label">YES</text>
  <rect x="900" y="100" width="190" height="92" rx="3" class="box"/><text x="920" y="132" class="t">Embedding service</text><text x="920" y="157" class="s">Minimum required content</text><text x="920" y="176" class="s">Versioned model</text><path d="M860 146h40" class="line" marker-end="url(#arrow)"/>
  <text x="48" y="366" class="label">RETRIEVAL AND MODEL PLANE</text>
  <rect x="48" y="386" width="210" height="92" rx="3" class="box"/><text x="68" y="418" class="t">Authenticated request</text><text x="68" y="443" class="s">Identity · tenant · purpose</text><text x="68" y="462" class="s">Trusted claims only</text>
  <rect x="300" y="386" width="195" height="92" rx="3" class="control"/><text x="320" y="418" class="t">Policy decision</text><text x="320" y="443" class="s">Current ACL · label</text><text x="320" y="462" class="s">Tenant · retention</text><path d="M258 432h42" class="line" marker-end="url(#arrow)"/>
  <path d="M587 380l92 52-92 52-92-52z" class="control"/><text x="534" y="427" class="t">Authorized</text><text x="548" y="449" class="s">retrieval?</text><path d="M495 432h5" class="line" marker-end="url(#arrow)"/>
  <rect x="720" y="386" width="190" height="92" rx="3" class="box"/><text x="740" y="418" class="t">Prompt assembly</text><text x="740" y="443" class="s">Bounded context</text><text x="740" y="462" class="s">Provenance preserved</text><path d="M679 432h41" class="line" marker-end="url(#arrow)"/>
  <rect x="950" y="386" width="190" height="92" rx="3" class="box"/><text x="970" y="418" class="t">Model or agent</text><text x="970" y="443" class="s">No policy authority</text><text x="970" y="462" class="s">Retrieved data is untrusted</text><path d="M910 432h40" class="line" marker-end="url(#arrow)"/>
  <rect x="900" y="238" width="190" height="92" rx="3" class="store"/><text x="920" y="270" class="t">Tenant-scoped vectors</text><text x="920" y="295" class="s">Metadata · policy reference</text><text x="920" y="314" class="s">Encryption · audit</text><path d="M995 192v46" class="line" marker-end="url(#arrow)"/><path d="M900 330v20H587v30" class="line" marker-end="url(#arrow)"/>
  <rect x="495" y="530" width="184" height="76" rx="3" class="deny"/><text x="515" y="562" class="t">Deny and record</text><text x="515" y="585" class="s">Do not release the chunk</text><path d="M587 484v46" class="event" marker-end="url(#eventarrow)"/><text x="598" y="510" class="eventlabel">NO / STALE / UNKNOWN</text>
  <rect x="950" y="530" width="190" height="76" rx="3" class="store"/><text x="970" y="562" class="t">Isolated memory</text><text x="970" y="585" class="s">Scope · TTL · deletion</text><path d="M1045 478v52" class="line" marker-end="url(#arrow)"/>
  <rect x="720" y="530" width="190" height="76" rx="3" class="control"/><text x="740" y="562" class="t">Output controls</text><text x="740" y="585" class="s">DLP · citations · audit</text><path d="M950 454l-40 76" class="line" marker-end="url(#arrow)"/>
  <rect x="48" y="650" width="1092" height="60" rx="3" class="box"/><text x="68" y="678" class="t">Lifecycle events</text><text x="68" y="699" class="s">Deletion · ACL change · relabel · legal hold · owner change · source invalidation → revoke derived chunks, caches, prompts, and memory</text>
  <path d="M995 650v-44" class="event" marker-end="url(#eventarrow)"/><path d="M900 650V330" class="event" marker-end="url(#eventarrow)"/><text x="914" y="636" class="eventlabel">INVALIDATE DERIVATIVES</text>
</svg>
